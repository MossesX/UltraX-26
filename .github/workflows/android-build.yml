name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # lets the main-branch build publish the APK as the "latest" release

jobs:
  build:
    name: Assemble + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate GLSL shaders (a broken shader disables the whole effects pipeline on the phone)
        run: |
          set -euo pipefail
          curl -sSL -o glslang.zip https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -qo glslang.zip -d glslang
          python3 tools/check_shaders.py glslang/bin/glslangValidator

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # The minified build is a bonus; a shrinker problem must never block the installable debug APK.
      - name: Assemble release APK (minified)
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UltraX26-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Phone-friendly download: every push to main republishes the debug APK at a stable URL that
      # needs no GitHub login —  https://github.com/<owner>/<repo>/releases/latest/download/UltraX26-debug.apk
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk UltraX26-debug.apk
          REL=app/build/outputs/apk/release
          if ls "$REL"/*.apk >/dev/null 2>&1; then cp "$REL"/$(ls "$REL" | grep -m1 '\.apk$') UltraX26-release.apk; fi
          NOTES="Automatic build of commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}).

          **Install on the phone:** download \`UltraX26-debug.apk\` below, open it, allow installs from your browser when Android asks, then tap Install. \`UltraX26-release.apk\` is the minified build; without a release keystore in the repository secrets it is signed with the debug key, so it installs the same way but is a different app id."
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest UltraX26-debug.apk $(ls UltraX26-release.apk 2>/dev/null) \
            --title "Latest build (main @ ${GITHUB_SHA::7})" --notes "$NOTES" --latest
