# coturn — TURN relay for UltraX 26 calls. Credentials come from docker-compose (--user / --realm).
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200
fingerprint
lt-cred-mech
no-cli
no-multicast-peers
# Allow the relay to be used only for media (block relaying to private ranges)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
# Uncomment for TURN over TLS once certificates are in place:
# cert=/etc/coturn/fullchain.pem
# pkey=/etc/coturn/privkey.pem
